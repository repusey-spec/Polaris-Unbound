name: Hush Lite Android compile-only gate

on:
  pull_request:
    branches: [experiment/hush-native-01]
    paths:
      - 'hush-lite/**'
      - '.github/workflows/hush-lite-android.yml'
  workflow_dispatch:

jobs:
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android 36 platform for isolated shell
        run: |
          echo "sdkmanager: $(command -v sdkmanager)"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-36" >/dev/null || true
          test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download pinned Hush source
        run: |
          git clone --quiet --depth 1 --branch v13.14.7 https://github.com/maxinjohn/Hush.git "$RUNNER_TEMP/hush-original"
          test "$(git -C "$RUNNER_TEMP/hush-original" rev-parse HEAD)" = "8f3e55d1114f1b844f0a21af8c365d090a43799f"
      - name: Stage Android plus the pinned Hush core
        run: |
          python3 hush-lite/scripts/stage_android.py --upstream "$RUNNER_TEMP/hush-original" --out "$RUNNER_TEMP/hush-lite-android"
          test -f "$RUNNER_TEMP/hush-lite-android/app/src/main/AndroidManifest.xml"
      - name: Compile app and manifest only — NO APK
        run: |
          gradle -p "$RUNNER_TEMP/hush-lite-android" --no-daemon :app:compileDebugKotlin :app:processDebugMainManifest
      - name: Require Android Main coroutine dispatcher at runtime
        run: |
          set -eo pipefail
          gradle -p "$RUNNER_TEMP/hush-lite-android" --no-daemon :app:dependencies --configuration debugRuntimeClasspath > "$RUNNER_TEMP/runtime-deps.txt"
          grep -F 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0' "$RUNNER_TEMP/runtime-deps.txt"
      - name: Verify APK was not assembled
        run: |
          test ! -d "$RUNNER_TEMP/hush-lite-android/app/build/outputs/apk"
          ! find "$RUNNER_TEMP/hush-lite-android" -type f -name '*.apk' | grep -q .
