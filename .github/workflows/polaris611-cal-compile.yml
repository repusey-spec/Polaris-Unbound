name: Polaris 6.11 CAL template compile only (NO APK)
on:
  push:
    branches: [experiment/polaris-6-11-cal-prototype]
    paths: ['polaris6/cal611.py', 'polaris6/verify611.py', '.github/workflows/polaris611-cal-compile.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polaris6-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Publish compile test run ID
        run: |
          mkdir -p polaris6/diagnostics
          printf 'RUN_ID=%s\nCOMMIT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > polaris6/diagnostics/611-compile-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add polaris6/diagnostics/611-compile-run.txt
          git commit -m 'Record CAL compile-only run' || true
          git push origin HEAD:experiment/polaris-6-11-cal-prototype
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Pin InterTune engine
        run: |
          git clone --depth 1 --branch v0.12.10 --recurse-submodules https://github.com/ItzSkyeYT/InterTune.git "$RUNNER_TEMP/intertune"
          test "$(git -C "$RUNNER_TEMP/intertune" rev-parse HEAD)" = 4ff39e9e12a20f93d5dfd24c52fe925cbbb50020
      - name: Apply Polaris integration and original signer
        run: |
          base64 -d polaris6/intertune.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply --check "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$RUNNER_TEMP/polaris.patch"
          python3 polaris6/native_603.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify.py "$RUNNER_TEMP/intertune"
          git -C "$RUNNER_TEMP/intertune" apply --check "$GITHUB_WORKSPACE/polaris6/radio604.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$GITHUB_WORKSPACE/polaris6/radio604.patch"
          git -C "$RUNNER_TEMP/intertune" apply --check "$GITHUB_WORKSPACE/polaris6/stream604.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$GITHUB_WORKSPACE/polaris6/stream604.patch"
          python3 polaris6/verify604.py "$RUNNER_TEMP/intertune"
          python3 polaris6/playlist605.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify605.py "$RUNNER_TEMP/intertune"
          python3 polaris6/fixes606.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify606.py "$RUNNER_TEMP/intertune"
          python3 polaris6/mini607.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify607.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa608.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify608.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa609.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify609.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa610.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify610.py "$RUNNER_TEMP/intertune"
          python3 polaris6/cal611.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify611.py "$RUNNER_TEMP/intertune"
          base64 -d .github/polaris-debug.keystore.b64 > "$RUNNER_TEMP/intertune/polaris.jks"
          cat > "$RUNNER_TEMP/intertune/keystore.properties" <<'EOF'
          storeFile=../polaris.jks
          storePassword=android
          keyAlias=polarisdebug
          keyPassword=android
          EOF
      - name: Android compiler SDK (no APK packaging)
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6' > /dev/null
      - name: Compile CAL media view and run radio-streaming regression unit tests
        working-directory: ${{ runner.temp }}/intertune
        run: |
          ./gradlew --build-cache :app:compileCoreReleaseKotlin :app:testCoreReleaseUnitTest --tests "com.dd3boh.outertune.polaris.PolarisAA609Test" --tests "com.dd3boh.outertune.polaris.PolarisAA608Test" --tests "com.dd3boh.outertune.polaris.PolarisVoiceRouterTest" --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Polaris-6.11-CAL-compile-tests-only-NO-APK
          path: ${{ runner.temp }}/intertune/app/build/test-results/testCoreReleaseUnitTest/
          retention-days: 14
      - name: Save compile-only conclusion
        if: always()
        run: |
          git fetch origin experiment/polaris-6-11-cal-prototype
          git reset --hard origin/experiment/polaris-6-11-cal-prototype
          mkdir -p polaris6/diagnostics
          if test -d "$RUNNER_TEMP/intertune/app/build/test-results/testCoreReleaseUnitTest" && ! grep -q '<failure' "$RUNNER_TEMP"/intertune/app/build/test-results/testCoreReleaseUnitTest/TEST-*.xml 2>/dev/null; then
            RESULT='Compile/test results present; check job conclusion'
          else
            RESULT='Compile/test missing or failed; check job logs'
          fi
          printf 'RUN_ID=%s\nRESULT=%s\nNO_APK=true\n' "$GITHUB_RUN_ID" "$RESULT" > polaris6/diagnostics/611-compile-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add polaris6/diagnostics/611-compile-result.txt
          git commit -m 'Record CAL compile-only result' || true
          git push origin HEAD:experiment/polaris-6-11-cal-prototype
