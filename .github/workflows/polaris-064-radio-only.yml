name: Polaris 0.64 Radio API Test APK
on:
  push:
    branches: [legacy-0.64-radio-only]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable 0.x APK signing key
        run: |
          base64 -d .github/polaris-debug.keystore.b64 > .github/polaris-debug.keystore
          keytool -list -keystore .github/polaris-debug.keystore -storepass android -alias polarisdebug >/dev/null
      - name: Compile APK
        run: gradle :app:assembleDebug
      - name: Verify and stage only APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" dist/Polaris_Radio_0.64_64.apk
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris_Radio_0.64_64
          path: dist/Polaris_Radio_0.64_64.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create polaris-v0.64 dist/Polaris_Radio_0.64_64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Polaris 0.64 - Radio API native test' \
            --notes 'Based on 0.63: radio-only phone home with fixed playback footer, white chronological chat, KBS song time/duration diagnostics. Existing media service and signing unchanged. Device testing pending.'
