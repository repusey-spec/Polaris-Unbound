name: Polaris v5.0 fresh Hush integration
on:
  push:
    branches: [experiment/polaris-v5-fresh]
    paths:
      - 'polaris-v5/**'
      - '.github/workflows/polaris-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Download newest confirmed Hush v13.14.8 source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v13.14.8 --recurse-submodules https://github.com/maxinjohn/Hush.git "$RUNNER_TEMP/hush"
          test "$(git -C "$RUNNER_TEMP/hush" rev-parse HEAD)" = "77835d11eaf833a79c968fda4479cce42d041952"
          grep -F 'versionName = "13.14.8"' "$RUNNER_TEMP/hush/app/build.gradle.kts"
      - name: Restore Hush lyric submodules with upstream overlays if needed
        run: |
          set -euo pipefail
          HUSH="$RUNNER_TEMP/hush"
          LYRICS="$HUSH/lyrics"
          git -C "$HUSH" submodule update --init --recursive lyrics
          for module in kugou lrclib simpmusic paxsenix betterlyrics unison youlyplus musixmatch; do
            if [ -d "$HUSH/overlays/lyrics/$module" ]; then
              mkdir -p "$LYRICS/$module"
              cp -a "$HUSH/overlays/lyrics/$module/." "$LYRICS/$module/"
            fi
            test -f "$LYRICS/$module/build.gradle.kts"
          done
      - name: Build clean v5 from pinned Hush and original v0.58 radio only
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow cairosvg
          base64 -d polaris-v5/v5-debug-keystore.b64 > "$RUNNER_TEMP/hush/polaris-v5-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/hush/polaris-v5-debug.keystore" -storepass android -alias polarisdebug >/dev/null
          python3 -m py_compile polaris-v5/patch_v5.py polaris-v5/icons_v5.py polaris-v5/verify_v5.py
          python3 polaris-v5/patch_v5.py "$RUNNER_TEMP/hush"
          python3 polaris-v5/icons_v5.py "$RUNNER_TEMP/hush"
          python3 polaris-v5/verify_v5.py "$RUNNER_TEMP/hush"
      - name: Compile Polaris v5 APK
        working-directory: ${{ runner.temp }}/hush
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGmsMobileArm64Debug
      - name: Verify installed v5 APK ID version and persistent signature
        run: |
          set -euo pipefail
          APK=$(find "$RUNNER_TEMP/hush/app/build/outputs/apk/gmsMobileArm64/debug" -name '*.apk' -print -quit)
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/v5-apk-badging.txt | grep -E "^(package:|application-label:)"
          grep -F "name='app.hush.music.polarisv5'" /tmp/v5-apk-badging.txt
          grep -F "versionCode='$((500000 + GITHUB_RUN_NUMBER))'" /tmp/v5-apk-badging.txt
          grep -Fx "application-label:'Polaris v5'" /tmp/v5-apk-badging.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          EXPECTED_CERT=$(keytool -exportcert -keystore "$RUNNER_TEMP/hush/polaris-v5-debug.keystore" -storepass android -alias polarisdebug | sha256sum | awk '{print $1}')
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/v5-apk-signer.txt
          grep -Fi "$EXPECTED_CERT" /tmp/v5-apk-signer.txt
      - name: Package Polaris v5 APK
        run: |
          set -euo pipefail
          APK_DIR="$RUNNER_TEMP/hush/app/build/outputs/apk/gmsMobileArm64/debug"
          ORIGINAL=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          mv "$ORIGINAL" "$APK_DIR/Polaris_v5.0_Build_${GITHUB_RUN_NUMBER}.apk"
          ls -lh "$APK_DIR"/Polaris_v5.0_Build_*.apk
      - name: Upload v5 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Polaris-v5.0-Build-${{ github.run_number }}
          path: ${{ runner.temp }}/hush/app/build/outputs/apk/gmsMobileArm64/debug/Polaris_v5.0_Build_*.apk
          if-no-files-found: error
          retention-days: 14
