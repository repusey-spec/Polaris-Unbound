name: Polaris 6.09 permanent APK download
on:
  push:
    branches: [experiment/polaris-6-09-stable-root]
    paths: ['.github/workflows/polaris609-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait for tested 6.09 build and Android 13 smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 43987035815 --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: Polaris-6.09-100609
          path: artifact
          run-id: 43987035815
          github-token: ${{ github.token }}
      - name: Validate actual signed APK and version
        run: |
          test -s artifact/Polaris_6.09_100609.apk
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          echo "$expected  artifact/Polaris_6.09_100609.apk" | sha256sum --check -
          grep "package: name='app.hush.music.polarisradio.debug' versionCode='100609' versionName='6.09'" artifact/apk-badging.txt
          grep '477721bae3a205d4e6369e76482868978b74931a0b2c4dfe85f3b07a7b40bea8' artifact/signature.txt
          unzip -t artifact/Polaris_6.09_100609.apk > /dev/null
      - name: Publish stable direct download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          if ! gh release view 'polaris-v6.09' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create 'polaris-v6.09' --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Polaris Unbound 6.09 (100609)' \
              --notes "Fix AA Streaming InterTune-style 4 category icons + playable song list by routing cached playlist and streaming entry IDs to one home; real playlist remains separately accessible. Rebuild versioned radio station browse IDs and centered programme artwork with actual PNG provider runtime test. 6.08 playback, radio, database, signer maintained. SHA-256: $expected."
          fi
          gh release upload 'polaris-v6.09' 'artifact/Polaris_6.09_100609.apk' --repo "$GITHUB_REPOSITORY" --clobber
          gh release view 'polaris-v6.09' --repo "$GITHUB_REPOSITORY" --json url,assets
