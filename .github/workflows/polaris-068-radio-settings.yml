name: Polaris 0.68 Radio Settings Recent Media APK
on:
  push:
    branches: [legacy-0.68-radio-settings-recent-media]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing 0.x APK signing key
        run: |
          base64 -d .github/polaris-debug.keystore.b64 > .github/polaris-debug.keystore
          keytool -list -keystore .github/polaris-debug.keystore -storepass android -alias polarisdebug >/dev/null
      - name: Compile APK
        run: gradle :app:assembleDebug
      - name: Verify signed APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" dist/Polaris_Radio_0.68_68.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris_Radio_0.68_68
          path: dist/Polaris_Radio_0.68_68.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed APK in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create polaris-v0.68 dist/Polaris_Radio_0.68_68.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Polaris Radio 0.68 (68)' \
            --notes 'Based on signed 0.67. Four last-played station tiles, top-right settings, reversible listener chat, back-key exit/background setting, inline listener chat refresh/count, and MediaStyle lockscreen notification with radio previous/pause-resume/next controls. Device verification pending.'
