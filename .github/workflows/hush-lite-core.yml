name: Hush Lite Core-only source and JVM compilation

on:
  pull_request:
    branches: [experiment/hush-native-01]
    paths:
      - 'hush-lite/**'
      - '.github/workflows/hush-lite-core.yml'
  workflow_dispatch:

jobs:
  core-jvm-only:
    name: Verify Hush InnerTube JVM module (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Validate staging safeguards
        run: python3 -m unittest discover -s hush-lite/tests -v

      - name: Download pinned GPL-3.0 Hush source (read-only)
        run: |
          git clone --quiet --depth 1 --branch v13.14.7 \
            https://github.com/maxinjohn/Hush.git "$RUNNER_TEMP/hush-original"
          actual="$(git -C "$RUNNER_TEMP/hush-original" rev-parse HEAD)"
          test "$actual" = "8f3e55d1114f1b844f0a21af8c365d090a43799f"

      - name: Stage only Hush InnerTube core
        run: |
          python3 hush-lite/scripts/stage_core.py \
            --upstream "$RUNNER_TEMP/hush-original" \
            --out "$RUNNER_TEMP/hush-lite-core"
          test ! -d "$RUNNER_TEMP/hush-lite-core/app"
          test -f "$RUNNER_TEMP/hush-lite-core/LICENSE"

      - name: Compile JVM core — do not assemble an APK
        run: |
          gradle -p "$RUNNER_TEMP/hush-lite-core" --no-daemon :core:compileKotlin

      - name: Confirm no Android app output exists
        run: |
          test ! -d "$RUNNER_TEMP/hush-lite-core/app"
          ! find "$RUNNER_TEMP/hush-lite-core" -type f -name '*.apk' | grep -q .
