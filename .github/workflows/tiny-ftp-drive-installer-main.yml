name: tiny-ftp-drive-installer-main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tiny-ftp-drive-installer-main.yml'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tiny-ftp-drive-installer

      - name: Restore Tiny FTP Drive source
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'tiny-ftp-drive-build'
          $b64 = ''
          0..3 | ForEach-Object {
            $b64 += (Get-Content (Join-Path $base ("source.b64.part" + $_)) -Raw).Trim()
          }
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'TinyFtpDrive-source-v0.1.zip'), [Convert]::FromBase64String($b64))
          Expand-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'TinyFtpDrive-source-v0.1.zip') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'src') -Force
          $fs = Join-Path $env:GITHUB_WORKSPACE 'src\TinyFtpDrive\FtpFileSystem.cs'
          $src = Get-Content $fs -Raw
          $src = $src.Replace('using Fsp;', "using Fsp;`r`nusing VolumeInfo = Fsp.Interop.VolumeInfo;`r`nusing FileInfo = Fsp.Interop.FileInfo;")
          $src = $src.Replace('Fsp.FileInfo', 'FileInfo')
          Set-Content -Path $fs -Value $src -Encoding UTF8
          $proj = Join-Path $env:GITHUB_WORKSPACE 'src\TinyFtpDrive\TinyFtpDrive.csproj'
          $pc = Get-Content $proj -Raw
          $pc = $pc.Replace('</Project>', "  <ItemGroup>`r`n    <Reference Include=`"System.Security`" />`r`n  </ItemGroup>`r`n</Project>")
          Set-Content -Path $proj -Value $pc -Encoding UTF8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build x64 Release
        shell: pwsh
        run: |
          dotnet restore "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\TinyFtpDrive.csproj"
          dotnet build "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\TinyFtpDrive.csproj" -c Release --no-restore
          Get-ChildItem "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\bin\Release\net48"

      - name: Download WinFsp dependency
        shell: pwsh
        run: |
          $url = 'https://github.com/winfsp/winfsp/releases/download/v2.2B4/winfsp-2.2.26215.msi'
          $out = "$env:GITHUB_WORKSPACE\winfsp-2.2.26215.msi"
          Invoke-WebRequest -Uri $url -OutFile $out
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash
          if ($hash -ne '2ECB5C89405488A95BBD8A01875E02C48534FD37BBDFD84488F7590464D65944') {
            throw "WinFsp SHA256 mismatch: $hash"
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iss = @'
          [Setup]
          AppId=TinyFtpDrive.0.1
          AppName=Tiny FTP Drive
          AppVersion=0.1.0
          AppPublisher=Tiny FTP Drive
          DefaultDirName={autopf}\Tiny FTP Drive
          DefaultGroupName=Tiny FTP Drive
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=TinyFtpDrive-Setup-v0.1
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=Tiny FTP Drive
          CloseApplications=yes
          RestartApplications=no
          
          [Files]
          Source: "src\TinyFtpDrive\bin\Release\net48\TinyFtpDrive.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\TinyFtpDrive\bin\Release\net48\winfsp-msil.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\TinyFtpDrive\bin\Release\net48\TinyFtpDrive.exe.config"; DestDir: "{app}"; Flags: ignoreversion
          Source: "winfsp-2.2.26215.msi"; DestDir: "{tmp}"; Flags: deleteafterinstall
          
          [Icons]
          Name: "{group}\Tiny FTP Drive"; Filename: "{app}\TinyFtpDrive.exe"
          
          [Run]
          Filename: "msiexec.exe"; Parameters: "/i ""{tmp}\winfsp-2.2.26215.msi"" /qn /norestart"; StatusMsg: "WinFsp 파일 시스템 드라이버 설치 중..."; Flags: waituntilterminated; Check: not WinFspInstalled
          Filename: "{app}\TinyFtpDrive.exe"; Description: "Tiny FTP Drive 실행"; Flags: nowait postinstall skipifsilent
          
          [UninstallRun]
          Filename: "{cmd}"; Parameters: "/C taskkill /IM TinyFtpDrive.exe /F >NUL 2>&1 & exit /B 0"; Flags: runhidden; RunOnceId: "StopTinyFtpDrive"
          
          [Registry]
          Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueName: "TinyFtpDrive"; Flags: uninsdeletevalue
          
          [UninstallDelete]
          Type: filesandordirs; Name: "{localappdata}\TinyFtpDrive"
          
          [Code]
          function WinFspInstalled(): Boolean;
          begin
            Result := FileExists(ExpandConstant('{sys}\drivers\winfsp-x64.sys'));
          end;
          '@
          Set-Content -Path "$env:GITHUB_WORKSPACE\TinyFtpDrive.iss" -Value $iss -Encoding UTF8
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "$env:GITHUB_WORKSPACE\TinyFtpDrive.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TinyFtpDrive-Setup-v0.1
          path: dist/TinyFtpDrive-Setup-v0.1.exe
          if-no-files-found: error
