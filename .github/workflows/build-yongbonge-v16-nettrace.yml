name: Build yongbongE v0.16 NET-TRACE

on:
  push:
    branches:
      - yongbonge-v16-nettrace
    paths:
      - .github/workflows/build-yongbonge-v16-nettrace.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.11 base
        shell: pwsh
        run: |
          ./yongbongE-build/build-v11.ps1

      - name: Apply v0.16 NET-TRACE sources
        shell: pwsh
        run: |
          Copy-Item "yongbongE-expanded-v15-trace/FtpClient.cs" "src/TinyFtpDrive/FtpClient.cs" -Force
          Copy-Item "yongbongE-expanded-v16-nettrace/FtpFileSystem.cs" "src/TinyFtpDrive/FtpFileSystem.cs" -Force
          Copy-Item "yongbongE-expanded-v15-trace/Program.cs" "src/TinyFtpDrive/Program.cs" -Force
          Copy-Item "yongbongE-expanded-v15-trace/TraceLog.cs" "src/TinyFtpDrive/TraceLog.cs" -Force
          [IO.File]::WriteAllText("src/TinyFtpDrive/VERSION.txt", "0.16.0-NET-TRACE" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))

      - name: Compile v0.16 NET-TRACE
        shell: pwsh
        run: |
          dotnet build "src/TinyFtpDrive/TinyFtpDrive.csproj" -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "NET-TRACE build failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iss = [IO.File]::ReadAllText("yongbongE.iss")
          $iss = $iss.Replace("AppVersion=0.11.0", "AppVersion=0.16.0")
          $iss = $iss.Replace("OutputBaseFilename=yongbongE-Setup-v0.11", "OutputBaseFilename=yongbongE-Setup-v0.16-NET-TRACE")
          [IO.File]::WriteAllText("yongbongE-v16-nettrace.iss", $iss, (New-Object System.Text.UTF8Encoding($false)))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "yongbongE-v16-nettrace.iss"
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Verify outputs
        shell: pwsh
        run: |
          $exe = "dist/yongbongE-Setup-v0.16-NET-TRACE.exe"
          if (!(Test-Path $exe)) { throw "installer missing" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256
          Get-FileHash "src/TinyFtpDrive/FtpFileSystem.cs" -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-v0.16-NET-TRACE
          path: dist/yongbongE-Setup-v0.16-NET-TRACE.exe
          if-no-files-found: error
          retention-days: 30
