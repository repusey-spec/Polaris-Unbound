name: Polaris Hush radio integration compile
on:
  push:
    branches: [experiment/polaris-hush-radio-01]
    paths:
      - 'polaris-hush/**'
      - '.github/workflows/polaris-hush-radio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout pinned full Hush
        run: |
          git clone --depth 1 --branch v13.14.7 --recurse-submodules https://github.com/maxinjohn/Hush.git "$RUNNER_TEMP/hush"
          test "$(git -C "$RUNNER_TEMP/hush" rev-parse HEAD)" = "8f3e55d1114f1b844f0a21af8c365d090a43799f"
      - name: Restore missing lyrics subprojects from pinned Hush overlays
        run: |
          set -euxo pipefail
          HUSH="$RUNNER_TEMP/hush"
          LYRICS="$HUSH/lyrics"
          git -C "$HUSH" submodule update --init --recursive lyrics
          for module in kugou lrclib simpmusic paxsenix betterlyrics unison youlyplus musixmatch; do
            if [ -d "$HUSH/overlays/lyrics/$module" ]; then
              mkdir -p "$LYRICS/$module"
              cp -a "$HUSH/overlays/lyrics/$module/." "$LYRICS/$module/"
            fi
            test -f "$LYRICS/$module/build.gradle.kts" || {
              echo "::error::Missing Gradle module: $module"
              exit 1
            }
          done
      - name: Patch existing MediaLibrarySession and stage radio Kotlin sources
        run: |
          python3 polaris-hush/patch_hush_browse.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_radio_all.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_phone_ui.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_mini_player.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_radio_recovery.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_radio_network.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_radio_transport.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_radio_projection.py "$RUNNER_TEMP/hush"
          # Reuse existing stable Polaris debug identity across ephemeral runners.
          base64 -d .github/polaris-debug.keystore.b64 > "$RUNNER_TEMP/hush/polaris-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/hush/polaris-debug.keystore" -storepass android -alias polarisdebug >/dev/null
          python3 polaris-hush/patch_hush_branding.py "$RUNNER_TEMP/hush"
          python3 -m pip install --quiet --disable-pip-version-check pillow cairosvg
          python3 polaris-hush/patch_hush_icon.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_ui42.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_voice.py "$RUNNER_TEMP/hush"
          python3 polaris-hush/patch_hush_ui47.py "$RUNNER_TEMP/hush"
          mkdir -p "$RUNNER_TEMP/hush/app/src/main/kotlin/app/hush/music/polaris"
          cp polaris-hush/*.kt "$RUNNER_TEMP/hush/app/src/main/kotlin/app/hush/music/polaris/"
          mkdir -p "$RUNNER_TEMP/hush/app/src/main/java/app/hush/music/polaris"
          cp polaris-hush/StationArt.java polaris-hush/CurrentProgramResolver.java "$RUNNER_TEMP/hush/app/src/main/java/app/hush/music/polaris/"
          sed -i '/implementation(libs.guava)/a\    implementation("org.jsoup:jsoup:1.18.3")' "$RUNNER_TEMP/hush/app/build.gradle.kts"
          python3 -m py_compile polaris-hush/patch_hush_browse.py polaris-hush/patch_hush_radio_all.py polaris-hush/patch_hush_phone_ui.py polaris-hush/patch_hush_mini_player.py polaris-hush/patch_hush_branding.py polaris-hush/patch_hush_radio_recovery.py polaris-hush/patch_hush_radio_network.py polaris-hush/patch_hush_radio_transport.py polaris-hush/patch_hush_radio_projection.py polaris-hush/patch_hush_icon.py polaris-hush/patch_hush_ui42.py polaris-hush/patch_hush_voice.py polaris-hush/patch_hush_ui47.py
      - name: Compile original Hush with Polaris radio
        working-directory: ${{ runner.temp }}/hush
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGmsMobileArm64Debug
      - name: Verify installed APK label is Polaris
        run: |
          set -euo pipefail
          APK=$(find "$RUNNER_TEMP/hush/app/build/outputs/apk/gmsMobileArm64/debug" -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/polaris-apk-badging.txt | grep -E "^(package:|application-label:)"
          grep -Fx "application-label:'Polaris'" /tmp/polaris-apk-badging.txt
          grep -F "name='app.hush.music.polarisradio.debug'" /tmp/polaris-apk-badging.txt
          EXPECTED_CODE=$((100000 + GITHUB_RUN_NUMBER))
          grep -F "versionCode='$EXPECTED_CODE'" /tmp/polaris-apk-badging.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          EXPECTED_CERT=$(keytool -exportcert -keystore "$RUNNER_TEMP/hush/polaris-debug.keystore" -storepass android -alias polarisdebug | sha256sum | awk '{print $1}')
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/polaris-apk-signer.txt
          echo "Expected pinned cert SHA256: $EXPECTED_CERT"
          grep -Fi "$EXPECTED_CERT" /tmp/polaris-apk-signer.txt
      - name: Rename verified APK to end with build number
        run: |
          set -euo pipefail
          APK_DIR="$RUNNER_TEMP/hush/app/build/outputs/apk/gmsMobileArm64/debug"
          ORIGINAL_APK=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$ORIGINAL_APK"
          TARGET_APK="$APK_DIR/Polaris_Build_${GITHUB_RUN_NUMBER}.apk"
          mv "$ORIGINAL_APK" "$TARGET_APK"
          test -s "$TARGET_APK"
          echo "Final APK name: $(basename "$TARGET_APK")"
      - name: Upload APK only if compile succeeds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Polaris-Build-${{ github.run_number }}
          path: ${{ runner.temp }}/hush/app/build/outputs/apk/gmsMobileArm64/debug/Polaris_Build_*.apk
          if-no-files-found: error
          retention-days: 7
