name: Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        run: |
          base64 -d .github/polaris-debug.keystore.b64 > .github/polaris-debug.keystore
          keytool -list -keystore .github/polaris-debug.keystore -storepass android -alias polarisdebug >/dev/null
      - name: Verify Naver radio schedule contract
        run: |
          python - <<'PY'
          import datetime, json, re, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo

          endpoint = "https://m.search.naver.com/p/csearch/content/nqapirender.nhn"
          referer = "https://m.search.naver.com/search.naver?where=m&query=%ED%8E%B8%EC%84%B1%ED%91%9C"
          service_ids = {
              "KBS CoolFM": "815457",
              "MBC FM4U": "815463",
              "CBS MusicFM": "815449",
              "MBC StandardFM": "815464",
              "SBS PowerFM": "815467",
          }

          day = datetime.datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y%m%d")
          now = datetime.datetime.now(ZoneInfo("Asia/Seoul"))
          now_min = now.hour * 60 + now.minute

          for name, sid in service_ids.items():
              params = urllib.parse.urlencode({
                  "key": "SingleChannelDailySchedule",
                  "where": "m",
                  "pkid": "66",
                  "u1": sid,
                  "u2": day,
              })
              req = urllib.request.Request(
                  endpoint + "?" + params,
                  headers={
                      "User-Agent": "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/120.0 Mobile Safari/537.36",
                      "Referer": referer,
                      "Accept": "application/json,text/plain,*/*",
                      "Accept-Language": "ko-KR,ko;q=0.9,en-US;q=0.7",
                  },
              )
              with urllib.request.urlopen(req, timeout=15) as res:
                  data = json.loads(res.read().decode("utf-8"))

              assert str(data.get("statusCode", "")).lower() == "success", (name, data.get("statusCode"))
              html = "".join(data.get("dataHtml") or [])
              assert html, f"{name}: empty dataHtml"

              entries = []
              rows = re.findall(r"(?is)<li[^>]*class=[\\\"'][^\\\"']*\\blist\\b[^\\\"']*[\\\"'][^>]*>(.*?)</li>", html)
              for row in rows:
                  tm = re.search(r"(?is)<div[^>]*class=[\\\"'][^\\\"']*\\btime\\b[^\\\"']*[\\\"'][^>]*>\\s*(\\d{1,2}:\\d{2})\\s*</div>", row)
                  tt = re.search(r"(?is)<div[^>]*class=[\\\"'][^\\\"']*\\bpr_title\\b[^\\\"']*[\\\"'][^>]*>(.*?)</div>", row)
                  if not tm or not tt:
                      continue
                  title = re.sub(r"(?is)<[^>]+>", " ", tt.group(1))
                  title = re.sub(r"\\s+", " ", title).strip()
                  if title and re.search(r"[A-Za-z가-힣]", title):
                      entries.append((tm.group(1), title))

              assert entries, f"{name}: semantic Naver parser found zero entries"

              current = None
              for hhmm, title in entries:
                  h, m = map(int, hhmm.split(":"))
                  if h * 60 + m <= now_min:
                      current = (hhmm, title)
              if current is None:
                  current = entries[-1]

              print(name, "OK", sid, "rows", len(entries), "current", current[0], current[1])
          PY
      - run: gradle assembleDebug
      - name: Verify APK signature
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris-Unbound-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
