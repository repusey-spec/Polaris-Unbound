name: Polaris YTM Share Chooser Test 07 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/ytm-integrated-test.yml'
  workflow_dispatch:

jobs:
  integrated-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable signing key
        run: |
          base64 -d .github/polaris-debug.keystore.b64 > .github/polaris-debug.keystore
          keytool -list -keystore .github/polaris-debug.keystore -storepass android -alias polarisdebug >/dev/null
      - name: Run YT Music Java parser and deep link unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/ytm-jvm-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/ytm-jvm-tests" \
            app/src/main/java/com/polarisunbound/app/PolarisYtmLabelParser.java \
            diagnostics/jvm/PolarisYtmLabelParserTest.java \
            app/src/main/java/com/polarisunbound/app/PolarisYtmDeepLink.java \
            diagnostics/jvm/PolarisYtmDeepLinkTest.java \
            app/src/main/java/com/polarisunbound/app/PolarisYtmSharedPlaylist.java \
            diagnostics/jvm/PolarisYtmSharedPlaylistTest.java \
            diagnostics/jvm/PolarisYtmShareRoundTripTest.java
          java -cp "$RUNNER_TEMP/ytm-jvm-tests" com.polarisunbound.app.PolarisYtmLabelParserTest
          java -cp "$RUNNER_TEMP/ytm-jvm-tests" com.polarisunbound.app.PolarisYtmDeepLinkTest
          java -cp "$RUNNER_TEMP/ytm-jvm-tests" com.polarisunbound.app.PolarisYtmSharedPlaylistTest
          java -cp "$RUNNER_TEMP/ytm-jvm-tests" com.polarisunbound.app.PolarisYtmShareRoundTripTest
      - name: Build isolated Polaris + YTM integration test
        run: gradle :app:assembleDebug
      - name: Verify separate test APK identity, signature and installer
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -E "package: name='com.polarisunbound.app.test'.*versionCode='5907'"
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris-0.58-YTM-Share-Chooser-Test-07
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
