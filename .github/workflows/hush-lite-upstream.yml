name: Hush Lite upstream baseline compile

on:
  push:
    branches: [experiment/hush-lite-upstream-01]
    paths:
      - 'hush-lite-upstream/**'
      - '.github/workflows/hush-lite-upstream.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout exact original Hush (no simplified search adapter)
        run: |
          git clone --depth 1 --branch v13.14.7 https://github.com/maxinjohn/Hush.git "$RUNNER_TEMP/hush"
          test "$(git -C "$RUNNER_TEMP/hush" rev-parse HEAD)" = "8f3e55d1114f1b844f0a21af8c365d090a43799f"
      - name: Validate original engine and AA entrypoints are present
        run: |
          test -s "$RUNNER_TEMP/hush/core/src/main/kotlin/app/hush/music/innertube/YouTube.kt"
          test -s "$RUNNER_TEMP/hush/app/src/main/kotlin/app/hush/music/playback/MediaLibrarySessionCallback.kt"
          test -s "$RUNNER_TEMP/hush/app/src/main/kotlin/app/hush/music/playback/MusicService.kt"
          test -s "$RUNNER_TEMP/hush/app/src/main/kotlin/app/hush/music/playback/queues/YouTubeQueue.kt"
      - name: Compile unmodified upstream Android app (no APK)
        working-directory: ${{ runner.temp }}/hush
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:compileGmsMobileArm64DebugKotlin
