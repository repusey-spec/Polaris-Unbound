name: Polaris 6.0 InterTune core release
on:
  push:
    branches: [experiment/polaris-6-intertune]
    paths: ['polaris6/**', '.github/workflows/polaris6.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polaris6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Pin InterTune engine
        run: |
          git clone --depth 1 --branch v0.12.10 --recurse-submodules https://github.com/ItzSkyeYT/InterTune.git "$RUNNER_TEMP/intertune"
          test "$(git -C "$RUNNER_TEMP/intertune" rev-parse HEAD)" = 4ff39e9e12a20f93d5dfd24c52fe925cbbb50020
      - name: Apply Polaris integration and original signer
        run: |
          base64 -d polaris6/intertune.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply --check "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$RUNNER_TEMP/polaris.patch"
          base64 -d .github/polaris-debug.keystore.b64 > "$RUNNER_TEMP/intertune/polaris.jks"
          cat > "$RUNNER_TEMP/intertune/keystore.properties" <<'EOF'
          storeFile=polaris.jks
          storePassword=android
          keyAlias=polarisdebug
          keyPassword=android
          EOF
          python3 polaris6/verify.py "$RUNNER_TEMP/intertune"
      - name: Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6' > /dev/null
      - name: Tests and minified core release
        working-directory: ${{ runner.temp }}/intertune
        run: ./gradlew :app:testCoreReleaseUnitTest --tests "com.dd3boh.outertune.polaris.*" --tests "com.dd3boh.outertune.playback.BadCachedCopyTest" --tests "com.dd3boh.outertune.playback.RecoveryTest" --tests "com.dd3boh.outertune.playback.ResumePointTest" --tests "com.dd3boh.outertune.playback.BluetoothResumeTest" :app:assembleCoreRelease --stacktrace --max-workers=2
      - name: Verify install identity and signature
        run: |
          mkdir -p delivery
          cp "$RUNNER_TEMP/intertune/app/build/outputs/apk/core/release/"*.apk delivery/Polaris_6.0_100600.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging delivery/Polaris_6.0_100600.apk > delivery/apk-badging.txt
          grep "package: name='app.hush.music.polarisradio.debug' versionCode='100600' versionName='6.0'" delivery/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs delivery/Polaris_6.0_100600.apk > delivery/signature.txt
          grep '477721bae3a205d4e6369e76482868978b74931a0b2c4dfe85f3b07a7b40bea8' delivery/signature.txt
          sha256sum delivery/Polaris_6.0_100600.apk > delivery/SHA256.txt
          cp "$RUNNER_TEMP/intertune/app/build/outputs/mapping/coreRelease/mapping.txt" delivery/ProGuard-mapping.txt
          cp -r "$RUNNER_TEMP/intertune/app/build/test-results/testCoreReleaseUnitTest" delivery/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Polaris-6.0-100600
          path: delivery/
          retention-days: 30
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Polaris-6.0-100600
          path: delivery
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 polaris6/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Polaris-6.0-smoke
          path: smoke/
          retention-days: 14
