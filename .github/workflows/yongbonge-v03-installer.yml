name: yongbonge-v03-installer-v3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yongbonge-v03-installer.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yongbonge-v03-build

      - name: Restore v0.2 source and apply v0.3 changes
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'yongbongE-build'
          $b64 = ''
          foreach ($name in @('source.b64.part0','source.b64.part1a','source.b64.part1b','source.b64.part2a','source.b64.part2b','source.b64.part3')) {
            $b64 += (Get-Content (Join-Path $base $name) -Raw).Trim()
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE 'yongbongE-source-v0.2.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '445BB7F6F1432658B57AAF9933465E3B5AAC78696249C1E8040E6A87E736081C') {
            throw "v0.2 base source hash mismatch: $hash"
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'src'
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $py = @'
          from pathlib import Path

          root = Path(r"__ROOT__")

          def rep(s, old, new, label):
              if old not in s:
                  raise SystemExit("missing patch target: " + label)
              return s.replace(old, new, 1)

          p = root / "FtpClient.cs"
          s = p.read_text(encoding="utf-8")
          s = rep(s,
              '        private readonly Encoding _strictUtf8 = new UTF8Encoding(false, true);\n',
              '        private readonly Encoding _strictUtf8 = new UTF8Encoding(false, true);\n        private static readonly TimeSpan DirectoryCacheLifetime = TimeSpan.FromSeconds(30);\n',
              "dir cache const")
          old = '''            string parent = ParentPath(path);
              string leaf = LeafName(path);
              List<RemoteEntry> list = List(parent);
              foreach (RemoteEntry e in list)
                  if (string.Equals(e.Name, leaf, StringComparison.OrdinalIgnoreCase))
                      return e;
              return null;
          }

          public List<RemoteEntry> List(string path)
          {
              path = NormalizePath(path);
              lock (_sync)
              {
                  CacheItem cached;
                  if (_dirCache.TryGetValue(path, out cached) && cached.ExpiresUtc > DateTime.UtcNow)
                      return CloneEntries(cached.Entries);

                  List<RemoteEntry> result = RunWithReconnectNoLock(() => ListNoLock(path));
                  _dirCache[path] = new CacheItem { ExpiresUtc = DateTime.UtcNow.AddMilliseconds(1500), Entries = CloneEntries(result) };
                  return result;
              }
          }'''
          new = '''            string parent = ParentPath(path);
              string leaf = LeafName(path);
              lock (_sync)
              {
                  List<RemoteEntry> list = GetDirectoryEntriesNoLock(parent);
                  foreach (RemoteEntry e in list)
                      if (string.Equals(e.Name, leaf, StringComparison.OrdinalIgnoreCase))
                          return CloneEntry(e);
                  return null;
              }
          }

          public List<RemoteEntry> List(string path)
          {
              path = NormalizePath(path);
              lock (_sync)
                  return CloneEntries(GetDirectoryEntriesNoLock(path));
          }

          private List<RemoteEntry> GetDirectoryEntriesNoLock(string path)
          {
              CacheItem cached;
              if (_dirCache.TryGetValue(path, out cached) && cached.ExpiresUtc > DateTime.UtcNow)
                  return cached.Entries;

              List<RemoteEntry> result = RunWithReconnectNoLock(() => ListNoLock(path));
              _dirCache[path] = new CacheItem
              {
                  ExpiresUtc = DateTime.UtcNow.Add(DirectoryCacheLifetime),
                  Entries = result
              };
              return result;
          }'''
          s = rep(s, old, new, "Stat/List")
          s = rep(s, '                    ns.ReadTimeout = 5000;\n', '                    ns.ReadTimeout = 8000;\n', "range timeout")
          s = rep(s, '                if (total > 0) Buffer.BlockCopy(buffer, 0, trimmed, 0, total);\n',
                    '                if (total > 0) System.Buffer.BlockCopy(buffer, 0, trimmed, 0, total);\n',
                    "client Buffer")
          s = rep(s,
              '        private static List<RemoteEntry> CloneEntries(List<RemoteEntry> src)\n        {\n',
              '''        private static RemoteEntry CloneEntry(RemoteEntry e)
          {
              return new RemoteEntry
              {
                  Name = e.Name,
                  FullPath = e.FullPath,
                  IsDirectory = e.IsDirectory,
                  Size = e.Size,
                  ModifiedUtc = e.ModifiedUtc
              };
          }

          private static List<RemoteEntry> CloneEntries(List<RemoteEntry> src)
          {
          ''',
              "CloneEntry")
          p.write_text(s, encoding="utf-8")

          p = root / "FtpFileSystem.cs"
          s = p.read_text(encoding="utf-8")
          s = rep(s,
              '''            public byte[] ReadCache;
              public long ReadCacheOffset = -1;
          }

          private const int ReadBlockSize = 4 * 1024 * 1024;''',
              '''            public byte[] ReadCache;
              public long ReadCacheOffset = -1;
              public long LastReadEnd = -1;
              public int SequentialReadCount;
          }

          private const int MinReadBlockSize = 128 * 1024;
          private const int MidReadBlockSize = 512 * 1024;
          private const int LargeReadBlockSize = 1024 * 1024;
          private const int MaxReadBlockSize = 4 * 1024 * 1024;''',
              "read fields")
          s = rep(s,
              '            _cacheDir = AppConfig.CacheDirectory;\n',
              '            _cacheDir = AppConfig.CacheDirectory;\n            CleanupStaleTempFiles();\n',
              "temp cleanup ctor")
          s = rep(s,
              '''            lock (h)
              {
                  EnsureLocal(h, createEmpty: false);
                  h.Stream.SetLength(0);''',
              '''            lock (h)
              {
                  EnsureLocal(h, createEmpty: true);
                  h.Stream.SetLength(0);''',
              "overwrite no download")
          s = rep(s,
              '                byte[] output = new byte[wanted];\n',
              '''                long requestStart = checked((long)Offset);
              bool sequential = h.LastReadEnd >= 0 && requestStart == h.LastReadEnd;
              if (sequential) h.SequentialReadCount = Math.Min(h.SequentialReadCount + 1, 16);
              else h.SequentialReadCount = 0;

              int prefetch = AdaptiveReadSize(h.SequentialReadCount);
              byte[] output = new byte[wanted];
          ''',
              "adaptive prefetch state")
          s = rep(s,
              '''                    if (!cacheHit)
                  {
                      long blockStart = (position / ReadBlockSize) * ReadBlockSize;
                      int blockLength = (int)Math.Min((long)ReadBlockSize, fileSize - blockStart);
                      if (blockLength <= 0) break;

                      h.ReadCache = _ftp.ReadRange(h.RemotePath, blockStart, blockLength);
                      h.ReadCacheOffset = blockStart;
                      if (h.ReadCache == null || h.ReadCache.Length == 0) break;
                  }''',
              '''                    if (!cacheHit)
                  {
                      int remainingWanted = wanted - copied;
                      int blockLength = Math.Max(remainingWanted, prefetch);
                      blockLength = (int)Math.Min((long)blockLength, fileSize - position);
                      if (blockLength <= 0) break;

                      h.ReadCache = _ftp.ReadRange(h.RemotePath, position, blockLength);
                      h.ReadCacheOffset = position;
                      if (h.ReadCache == null || h.ReadCache.Length == 0) break;
                  }''',
              "adaptive read block")
          s = s.replace('                    Buffer.BlockCopy(h.ReadCache, cacheIndex, output, copied, take);\n',
                        '                    System.Buffer.BlockCopy(h.ReadCache, cacheIndex, output, copied, take);\n')
          s = rep(s,
              '''                    // 서버가 요청 블록보다 일찍 EOF를 반환한 경우 재요청 루프를 막는다.
                  if (h.ReadCache.Length < ReadBlockSize &&
                      cacheIndex + take >= h.ReadCache.Length)
                      break;''',
              '''                    if (cacheIndex + take >= h.ReadCache.Length && h.ReadCache.Length < prefetch)
                      break;''',
              "adaptive eof")
          s = rep(s,
              '''                PBytesTransferred = (uint)copied;
              return STATUS_SUCCESS;''',
              '''                PBytesTransferred = (uint)copied;
              h.LastReadEnd = checked((long)Offset + copied);
              return STATUS_SUCCESS;''',
              "last read end")
          s = rep(s,
              '            _ftp.Rename(h.RemotePath, newPath);\n',
              '            if (h.Uploaded)\n                _ftp.Rename(h.RemotePath, newPath);\n',
              "rename unuploaded")
          s = rep(s,
              '        private void EnsureLocal(FtpHandle h, bool createEmpty)\n        {\n',
              '''        private static int AdaptiveReadSize(int sequentialCount)
          {
              if (sequentialCount >= 6) return MaxReadBlockSize;
              if (sequentialCount >= 3) return LargeReadBlockSize;
              if (sequentialCount >= 1) return MidReadBlockSize;
              return MinReadBlockSize;
          }

          private void CleanupStaleTempFiles()
          {
              try
              {
                  foreach (string file in Directory.GetFiles(_cacheDir, "*.tmp"))
                  {
                      try { File.Delete(file); } catch { }
                  }
              }
              catch { }
          }

          private void EnsureLocal(FtpHandle h, bool createEmpty)
          {
          ''',
              "helpers")
          p.write_text(s, encoding="utf-8")

          proj = root / "TinyFtpDrive.csproj"
          t = proj.read_text(encoding="utf-8").replace("<Version>0.2.0</Version>", "<Version>0.3.0</Version>")
          proj.write_text(t, encoding="utf-8")
          (root / "VERSION.txt").write_text("0.3.0\n", encoding="utf-8")
          sf = root / "SettingsForm.cs"
          t = sf.read_text(encoding="utf-8").replace("FTP only  ·  UTF-8 파일명  ·  대용량 파일 부분 읽기",
                                                     "FTP only  ·  UTF-8 파일명  ·  적응형 읽기 캐시")
          sf.write_text(t, encoding="utf-8")
          '@
          $root = (Join-Path $dest 'TinyFtpDrive').Replace('\','\\')
          $py = $py.Replace('__ROOT__', $root)
          $patcher = Join-Path $env:GITHUB_WORKSPACE 'apply_v03.py'
          Set-Content -Path $patcher -Value $py -Encoding UTF8
          python $patcher
          if ($LASTEXITCODE -ne 0) { throw "v0.3 source patch failed" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build x64
        shell: pwsh
        run: |
          $proj = "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\TinyFtpDrive.csproj"
          dotnet restore $proj
          dotnet build $proj -c Release --no-restore
          Get-ChildItem "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\bin\Release\net48"

      - name: Download WinFsp
        shell: pwsh
        run: |
          $url = 'https://github.com/winfsp/winfsp/releases/download/v2.2B4/winfsp-2.2.26215.msi'
          $out = "$env:GITHUB_WORKSPACE\winfsp-2.2.26215.msi"
          Invoke-WebRequest -Uri $url -OutFile $out
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash
          if ($hash -ne '2ECB5C89405488A95BBD8A01875E02C48534FD37BBDFD84488F7590464D65944') {
            throw "WinFsp SHA256 mismatch: $hash"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iss = @'
          [Setup]
          AppId=TinyFtpDrive.0.1
          AppName=yongbongE
          AppVersion=0.3.0
          AppPublisher=yongbongE
          DefaultDirName={autopf}\yongbongE
          DefaultGroupName=yongbongE
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=yongbongE-Setup-v0.3
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=yongbongE
          CloseApplications=yes
          RestartApplications=no

          [Files]
          Source: "src\TinyFtpDrive\bin\Release\net48\yongbongE.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\TinyFtpDrive\bin\Release\net48\yongbongE.exe.config"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\TinyFtpDrive\bin\Release\net48\winfsp-msil.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "winfsp-2.2.26215.msi"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Run]
          Filename: "msiexec.exe"; Parameters: "/i ""{tmp}\winfsp-2.2.26215.msi"" /qn /norestart"; StatusMsg: "WinFsp 파일 시스템 드라이버 설치 중..."; Flags: waituntilterminated; Check: not WinFspInstalled
          Filename: "{app}\yongbongE.exe"; Description: "yongbongE 실행"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{cmd}"; Parameters: "/C taskkill /IM yongbongE.exe /F >NUL 2>&1 & exit /B 0"; Flags: runhidden; RunOnceId: "StopyongbongE"

          [Code]
          function WinFspInstalled(): Boolean;
          begin
            Result := FileExists(ExpandConstant('{sys}\drivers\winfsp-x64.sys'));
          end;

          function InitializeSetup(): Boolean;
          var
            ResultCode: Integer;
          begin
            Exec(ExpandConstant('{cmd}'),
              '/C taskkill /IM yongbongE.exe /F >NUL 2>&1 & taskkill /IM TinyFtpDrive.exe /F >NUL 2>&1 & exit /B 0',
              '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Result := True;
          end;
          '@
          Set-Content -Path "$env:GITHUB_WORKSPACE\yongbongE.iss" -Value $iss -Encoding UTF8
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:GITHUB_WORKSPACE\yongbongE.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-Setup-v0.3
          path: dist/yongbongE-Setup-v0.3.exe
          if-no-files-found: error
