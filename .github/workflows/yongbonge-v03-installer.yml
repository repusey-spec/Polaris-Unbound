name: yongbonge-v03-installer-v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yongbonge-v03-installer.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yongbonge-v03-build

      - name: Restore v0.2 source and apply v0.3 patches
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'yongbongE-build'
          $b64 = ''
          foreach ($name in @('source.b64.part0','source.b64.part1a','source.b64.part1b','source.b64.part2a','source.b64.part2b','source.b64.part3')) {
            $b64 += (Get-Content (Join-Path $base $name) -Raw).Trim()
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE 'yongbongE-source-v0.2.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Write-Host "Base ZIP SHA256: $hash"
          if ($hash -ne '445BB7F6F1432658B57AAF9933465E3B5AAC78696249C1E8040E6A87E736081C') {
            throw "v0.2 base source hash mismatch: $hash"
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'src'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Set-Location (Join-Path $dest 'TinyFtpDrive')
          git init
          git add .
          git -c user.email=build@yongbonge.local -c user.name=yongbongE commit -m base
          git apply "$env:GITHUB_WORKSPACE\yongbongE-build\v03-client.patch"
          git apply "$env:GITHUB_WORKSPACE\yongbongE-build\v03-fs.patch"

          $proj = Join-Path (Get-Location) 'TinyFtpDrive.csproj'
          $pc = [IO.File]::ReadAllText($proj)
          $pc = $pc.Replace('<Version>0.2.0</Version>', '<Version>0.3.0</Version>')
          [IO.File]::WriteAllText($proj, $pc, (New-Object System.Text.UTF8Encoding($false)))

          [IO.File]::WriteAllText((Join-Path (Get-Location) 'VERSION.txt'), ('0.3.0' + [Environment]::NewLine), (New-Object System.Text.UTF8Encoding($false)))
          $sf = Join-Path (Get-Location) 'SettingsForm.cs'
          $sc = [IO.File]::ReadAllText($sf)
          $sc = $sc.Replace('FTP only  ·  UTF-8 파일명  ·  대용량 파일 부분 읽기', 'FTP only  ·  UTF-8 파일명  ·  적응형 읽기 캐시')
          [IO.File]::WriteAllText($sf, $sc, (New-Object System.Text.UTF8Encoding($false)))

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build x64
        shell: pwsh
        run: |
          $proj = "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\TinyFtpDrive.csproj"
          dotnet restore $proj
          dotnet build $proj -c Release --no-restore
          Get-ChildItem "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\bin\Release\net48"

      - name: Download WinFsp
        shell: pwsh
        run: |
          $url = 'https://github.com/winfsp/winfsp/releases/download/v2.2B4/winfsp-2.2.26215.msi'
          $out = "$env:GITHUB_WORKSPACE\winfsp-2.2.26215.msi"
          Invoke-WebRequest -Uri $url -OutFile $out
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash
          if ($hash -ne '2ECB5C89405488A95BBD8A01875E02C48534FD37BBDFD84488F7590464D65944') {
            throw "WinFsp SHA256 mismatch: $hash"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iss = @'
          [Setup]
          AppId=TinyFtpDrive.0.1
          AppName=yongbongE
          AppVersion=0.3.0
          AppPublisher=yongbongE
          DefaultDirName={autopf}\yongbongE
          DefaultGroupName=yongbongE
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=yongbongE-Setup-v0.3
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=yongbongE
          CloseApplications=yes
          RestartApplications=no

          [Files]
          Source: "src\TinyFtpDrive\bin\Release\net48\yongbongE.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\TinyFtpDrive\bin\Release\net48\yongbongE.exe.config"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\TinyFtpDrive\bin\Release\net48\winfsp-msil.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "winfsp-2.2.26215.msi"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Run]
          Filename: "msiexec.exe"; Parameters: "/i ""{tmp}\winfsp-2.2.26215.msi"" /qn /norestart"; StatusMsg: "WinFsp 파일 시스템 드라이버 설치 중..."; Flags: waituntilterminated; Check: not WinFspInstalled
          Filename: "{app}\yongbongE.exe"; Description: "yongbongE 실행"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{cmd}"; Parameters: "/C taskkill /IM yongbongE.exe /F >NUL 2>&1 & exit /B 0"; Flags: runhidden; RunOnceId: "StopyongbongE"

          [Code]
          function WinFspInstalled(): Boolean;
          begin
            Result := FileExists(ExpandConstant('{sys}\drivers\winfsp-x64.sys'));
          end;

          function InitializeSetup(): Boolean;
          var
            ResultCode: Integer;
          begin
            Exec(ExpandConstant('{cmd}'),
              '/C taskkill /IM yongbongE.exe /F >NUL 2>&1 & taskkill /IM TinyFtpDrive.exe /F >NUL 2>&1 & exit /B 0',
              '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Result := True;
          end;
          '@
          Set-Content -Path "$env:GITHUB_WORKSPACE\yongbongE.iss" -Value $iss -Encoding UTF8
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:GITHUB_WORKSPACE\yongbongE.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-Setup-v0.3
          path: dist/yongbongE-Setup-v0.3.exe
          if-no-files-found: error
