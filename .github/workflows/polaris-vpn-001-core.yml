name: Polaris VPN 0.01 - Windscribe core preflight
on:
  push:
    branches: [experiment/polaris-vpn-001]
    paths: [".github/workflows/polaris-vpn-001-core.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windscribe-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned Windscribe source and native dependencies
        run: |
          git clone --recurse-submodules https://github.com/Windscribe/Android-App.git "$RUNNER_TEMP/windscribe"
          cd "$RUNNER_TEMP/windscribe"
          git checkout 5a37e6afafded0279d67714eec878f9524ae90dc
          git submodule update --init --recursive
          git rev-parse HEAD
      - name: Select normal Windscribe account variant, not ESET
        working-directory: ${{ runner.temp }}/windscribe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('windscribe-core/build.gradle.kts')
          s = p.read_text()
          old = 'objects.named(ProductFlavorAttr::class.java, "whitelabel")'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'objects.named(ProductFlavorAttr::class.java, "fdroid")'))
          assert 'buildConfigField("String", "INTEGRATION", "\\"\\"")' in Path('base/build.gradle.kts').read_text()
          PY
      - name: Android native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Compile core and check consumer dependency contract
        working-directory: ${{ runner.temp }}/windscribe
        run: |
          chmod +x gradlew
          ./gradlew :windscribe-core:bundle --stacktrace --max-workers=2
          test -s windscribe-core/build/outputs/aar/windscribe-core.aar
          test -s windscribe-core/build/outputs/aar/windscribe-core-dependencies.gradle
          cp windscribe-core/build/outputs/aar/windscribe-core-dependencies.gradle partner-stub/windscribe-core-dependencies.gradle
          ./gradlew :partner-stub:minifyReleaseWithR8 --stacktrace --max-workers=2
      - name: Inspect package without publishing a test APK
        working-directory: ${{ runner.temp }}/windscribe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p = Path('windscribe-core/build/outputs/aar/windscribe-core.aar')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert 'classes.jar' in names
              for abi in ('armeabi-v7a','arm64-v8a'):
                  found=[n for n in names if n.startswith('jni/'+abi+'/') and n.endswith('.so')]
                  print(abi, found)
                  assert found, 'Missing native ABI '+abi
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Polaris-VPN-001-core-preflight-report
          path: |
            ${{ runner.temp }}/windscribe/windscribe-core/build/reports/
            ${{ runner.temp }}/windscribe/windscribe-core/build/outputs/aar/windscribe-core-dependencies.gradle
            ${{ runner.temp }}/windscribe/partner-stub/build/outputs/mapping/
          if-no-files-found: warn
          retention-days: 14
