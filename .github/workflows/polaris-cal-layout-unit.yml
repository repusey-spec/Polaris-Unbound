name: Polaris CAL Streaming layout source and unit validation (no APK)
on:
  push:
    branches: [experiment/polaris-cal-stream-layout]
    paths:
      - 'polaris6/cal_stream_layout_experiment.py'
      - '.github/workflows/polaris-cal-layout-unit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Apply 6.10 integration and isolated CAL experiment
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.12.10 --recurse-submodules https://github.com/ItzSkyeYT/InterTune.git "$RUNNER_TEMP/intertune"
          test "$(git -C "$RUNNER_TEMP/intertune" rev-parse HEAD)" = 4ff39e9e12a20f93d5dfd24c52fe925cbbb50020
          base64 -d polaris6/intertune.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply --check "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$RUNNER_TEMP/polaris.patch"
          python3 polaris6/native_603.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify.py "$RUNNER_TEMP/intertune"
          git -C "$RUNNER_TEMP/intertune" apply "$GITHUB_WORKSPACE/polaris6/radio604.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$GITHUB_WORKSPACE/polaris6/stream604.patch"
          python3 polaris6/verify604.py "$RUNNER_TEMP/intertune"
          python3 polaris6/playlist605.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify605.py "$RUNNER_TEMP/intertune"
          python3 polaris6/fixes606.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify606.py "$RUNNER_TEMP/intertune"
          python3 polaris6/mini607.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify607.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa608.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify608.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa609.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify609.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa610.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify610.py "$RUNNER_TEMP/intertune"
          python3 -m py_compile polaris6/cal_stream_layout_experiment.py
          python3 polaris6/cal_stream_layout_experiment.py "$RUNNER_TEMP/intertune"
          test ! -e "$RUNNER_TEMP/intertune/app/build/outputs/apk"
      - name: Android compile-only toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6' > /dev/null
      - name: Compile and run targeted layout unit tests, no APK packaging
        id: compile
        run: |
          cd "$RUNNER_TEMP/intertune"
          ./gradlew --build-cache :app:compileCoreReleaseKotlin :app:testCoreReleaseUnitTest --tests "com.dd3boh.outertune.playback.PolarisCALStreamingLayoutTest" --tests "com.dd3boh.outertune.polaris.PolarisAA609Test" --stacktrace --max-workers=2
          test ! -e app/build/outputs/apk
          echo 'PASS: CAL source compiles; no APK produced.'
      - name: Record check status
        if: always()
        env:
          CHECK: ${{ steps.compile.outcome }}
        run: |
          git fetch origin experiment/polaris-cal-stream-layout
          git reset --hard origin/experiment/polaris-cal-stream-layout
          mkdir -p polaris6/diagnostics
          printf 'RUN_ID=%s\nCOMPILE_UNIT_TESTS=%s\nAPK_GENERATED=no\n' "$GITHUB_RUN_ID" "$CHECK" > polaris6/diagnostics/cal-layout-source-check.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add polaris6/diagnostics/cal-layout-source-check.txt
          git commit -m 'Record CAL streaming layout compile-only validation' || true
          git push origin HEAD:experiment/polaris-cal-stream-layout
