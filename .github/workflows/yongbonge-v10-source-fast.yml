name: yongbonge-v10-source-fast
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yongbonge-v10-source-fast.yml']
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yongbonge-v10-build
      - name: Reconstruct patched v0.10 source only
        shell: pwsh
        run: |
          $script = Get-Content ./yongbongE-build/build-v10.ps1 -Raw
          $marker = '$utf8 = New-Object System.Text.UTF8Encoding($false)'
          $i = $script.IndexOf($marker)
          if ($i -lt 0) { throw 'build marker not found' }
          $reconstruct = $script.Substring(0, $i)
          Invoke-Expression $reconstruct
      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-v10-source-fast
          path: |
            src/TinyFtpDrive/FtpFileSystem.cs
            src/TinyFtpDrive/FtpClient.cs
            src/TinyFtpDrive/Program.cs
          if-no-files-found: error
