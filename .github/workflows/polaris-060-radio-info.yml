name: Polaris 0.60 Radio Info APK
on:
  push:
    branches: [legacy-0.60-radio-info]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable 0.x signing key
        run: |
          base64 -d .github/polaris-debug.keystore.b64 > .github/polaris-debug.keystore
          keytool -list -keystore .github/polaris-debug.keystore -storepass android -alias polarisdebug >/dev/null
      - name: Compile legacy 0.60 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify and stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" dist/Polaris_0.60_60.apk
          sha256sum dist/Polaris_0.60_60.apk
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris_0.60_60
          path: dist/Polaris_0.60_60.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view polaris-v0.60 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload polaris-v0.60 dist/Polaris_0.60_60.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create polaris-v0.60 dist/Polaris_0.60_60.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Polaris 0.60 - Radio details' \
              --notes 'Based on signed Polaris 0.59. Tapping a radio station starts playback and opens a new phone-only information screen; Back always returns to the unchanged radio channel grid without stopping audio. MBC mini and KBS official web information pages are embedded as a first-stage public-data bridge; real-time native message and track APIs are not implemented or verified yet. The prior Bluetooth-disconnect stop behavior remains.'
          fi
