name: Polaris 6.08 permanent APK download
on:
  push:
    branches: [experiment/polaris-6-08-aa-ui]
    paths: ['.github/workflows/polaris608-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require release build AND Android 13 session checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 43968397774 --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: Polaris-6.08-100608
          path: artifact
          run-id: 43968397774
          github-token: ${{ github.token }}
      - name: Validate APK contents and original signer
        run: |
          test -s artifact/Polaris_6.08_100608.apk
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          echo "$expected  artifact/Polaris_6.08_100608.apk" | sha256sum --check -
          grep "package: name='app.hush.music.polarisradio.debug' versionCode='100608' versionName='6.08'" artifact/apk-badging.txt
          grep '477721bae3a205d4e6369e76482868978b74931a0b2c4dfe85f3b07a7b40bea8' artifact/signature.txt
          unzip -t artifact/Polaris_6.08_100608.apk > /dev/null
      - name: Publish verified APK to durable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          if ! gh release view 'polaris-v6.08' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create 'polaris-v6.08' --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Polaris Unbound 6.08 (100608)' \
              --notes "AA Streaming browse: four InterTune category icons with song list directly below. Radio grid: composite artwork centers live programme and station names below logo. 6.07 playback/AA controls retained. Same-build Android 13 tests passed. SHA-256: $expected"
          fi
          gh release upload 'polaris-v6.08' 'artifact/Polaris_6.08_100608.apk' --repo "$GITHUB_REPOSITORY" --clobber
          gh release view 'polaris-v6.08' --repo "$GITHUB_REPOSITORY" --json url,assets
