name: Note3 Power APK

on:
  push:
    branches: [ main ]
    paths:
      - 'powerapp/**'
      - 'settings.gradle.kts'
      - '.github/workflows/note3-power.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle :powerapp:assembleDebug

      - name: Verify APK exists
        run: |
          ls -lh powerapp/build/outputs/apk/debug/
          test -n "$(find powerapp/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: Note3-Power-debug
          path: powerapp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
