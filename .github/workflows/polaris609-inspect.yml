name: Polaris 6.09 source route diagnosis
on:
  push:
    branches: [experiment/polaris-6-09-aa-routes]
    paths: ['.github/workflows/polaris609-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact 6.08 source
        run: |
          git clone --depth 1 --branch v0.12.10 --recurse-submodules https://github.com/ItzSkyeYT/InterTune.git "$RUNNER_TEMP/intertune"
          test "$(git -C "$RUNNER_TEMP/intertune" rev-parse HEAD)" = 4ff39e9e12a20f93d5dfd24c52fe925cbbb50020
          base64 -d polaris6/intertune.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$RUNNER_TEMP/polaris.patch"
          python3 polaris6/native_603.py "$RUNNER_TEMP/intertune"
          git -C "$RUNNER_TEMP/intertune" apply "$GITHUB_WORKSPACE/polaris6/radio604.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$GITHUB_WORKSPACE/polaris6/stream604.patch"
          python3 polaris6/playlist605.py "$RUNNER_TEMP/intertune"
          python3 polaris6/fixes606.py "$RUNNER_TEMP/intertune"
          python3 polaris6/mini607.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa608.py "$RUNNER_TEMP/intertune"
          mkdir inspect
          cp "$RUNNER_TEMP/intertune/app/src/main/AndroidManifest.xml" inspect/
          cp "$RUNNER_TEMP/intertune/app/build.gradle.kts" inspect/
          cp "$RUNNER_TEMP/intertune/app/src/main/java/com/dd3boh/outertune/playback/MediaLibrarySessionCallback.kt" inspect/
          cp "$RUNNER_TEMP/intertune/app/src/main/java/com/dd3boh/outertune/playback/MusicService.kt" inspect/
          cp "$RUNNER_TEMP/intertune/app/src/main/java/com/dd3boh/outertune/playback/AutoCar.kt" inspect/
          cp "$RUNNER_TEMP/intertune/app/src/main/java/com/dd3boh/outertune/playback/AutoBrowse.kt" inspect/
          cp "$RUNNER_TEMP/intertune/app/src/main/java/com/dd3boh/outertune/playback/PlayRequest.kt" inspect/
          cp "$RUNNER_TEMP/intertune/app/src/main/java/com/dd3boh/outertune/polaris/"*.kt inspect/
          grep -RniE 'STREAMING_ROOT_ID|RADIO_ROOT_ID|polarisStreamingHome|polarisRadioTile|queueItem|onGetChildren|onGetItem|browseTileUri|onSubscribe|notifyChildrenChanged|setMediaMetadata|grid|ContentStyle|onGetLibraryRoot' inspect/ > inspect/index.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris-6.08-route-diagnostic
          path: inspect/
          retention-days: 3
