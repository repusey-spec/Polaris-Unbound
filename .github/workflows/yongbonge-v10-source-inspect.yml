name: yongbonge-v10-source-inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yongbonge-v10-source-inspect.yml']
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yongbonge-v10-build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reconstruct v0.10 source
        shell: pwsh
        run: ./yongbongE-build/build-v10.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-v10-source
          path: |
            src/TinyFtpDrive/FtpFileSystem.cs
            src/TinyFtpDrive/FtpClient.cs
            src/TinyFtpDrive/Program.cs
          if-no-files-found: error
