name: yongbonge-v02-installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yongbonge-v02-installer.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yongbonge-v02-build

      - name: Restore source
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE 'yongbongE-build'
          $b64 = ''
          0..3 | ForEach-Object {
            $b64 += (Get-Content (Join-Path $base ("source.b64.part" + $_)) -Raw).Trim()
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE 'yongbongE-source-v0.2.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'src') -Force
          $fs = Join-Path $env:GITHUB_WORKSPACE 'src\TinyFtpDrive\FtpFileSystem.cs'
          $fc = Get-Content $fs -Raw
          $fc = $fc.Replace('Buffer.BlockCopy(', 'System.Buffer.BlockCopy(')
          Set-Content -Path $fs -Value $fc -Encoding UTF8
          $ftp = Join-Path $env:GITHUB_WORKSPACE 'src\TinyFtpDrive\FtpClient.cs'
          $tc = Get-Content $ftp -Raw
          $tc = $tc.Replace('Buffer.BlockCopy(', 'System.Buffer.BlockCopy(')
          Set-Content -Path $ftp -Value $tc -Encoding UTF8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build x64
        shell: pwsh
        run: |
          $proj = "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\TinyFtpDrive.csproj"
          dotnet restore $proj
          dotnet build $proj -c Release --no-restore
          Get-ChildItem "$env:GITHUB_WORKSPACE\src\TinyFtpDrive\bin\Release\net48"

      - name: Download WinFsp
        shell: pwsh
        run: |
          $url = 'https://github.com/winfsp/winfsp/releases/download/v2.2B4/winfsp-2.2.26215.msi'
          $out = "$env:GITHUB_WORKSPACE\winfsp-2.2.26215.msi"
          Invoke-WebRequest -Uri $url -OutFile $out
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash
          if ($hash -ne '2ECB5C89405488A95BBD8A01875E02C48534FD37BBDFD84488F7590464D65944') {
            throw "WinFsp SHA256 mismatch: $hash"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iss = @'
          [Setup]
          AppId=TinyFtpDrive.0.1
          AppName=yongbongE
          AppVersion=0.2.0
          AppPublisher=yongbongE
          DefaultDirName={autopf}\yongbongE
          DefaultGroupName=yongbongE
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=yongbongE-Setup-v0.2
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=yongbongE
          CloseApplications=yes
          RestartApplications=no

          [Files]
          Source: "src\TinyFtpDrive\bin\Release\net48\yongbongE.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\TinyFtpDrive\bin\Release\net48\yongbongE.exe.config"; DestDir: "{app}"; Flags: ignoreversion
          Source: "src\TinyFtpDrive\bin\Release\net48\winfsp-msil.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "winfsp-2.2.26215.msi"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [InstallDelete]
          Type: files; Name: "{app}\TinyFtpDrive.exe"
          Type: files; Name: "{app}\TinyFtpDrive.exe.config"

          [Icons]
          Name: "{group}\yongbongE"; Filename: "{app}\yongbongE.exe"

          [Run]
          Filename: "msiexec.exe"; Parameters: "/i ""{tmp}\winfsp-2.2.26215.msi"" /qn /norestart"; StatusMsg: "WinFsp 파일 시스템 드라이버 설치 중..."; Flags: waituntilterminated; Check: not WinFspInstalled
          Filename: "{app}\yongbongE.exe"; Description: "yongbongE 실행"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{cmd}"; Parameters: "/C taskkill /IM yongbongE.exe /F >NUL 2>&1 & exit /B 0"; Flags: runhidden; RunOnceId: "StopyongbongE"

          [Code]
          function WinFspInstalled(): Boolean;
          begin
            Result := FileExists(ExpandConstant('{sys}\drivers\winfsp-x64.sys'));
          end;

          function InitializeSetup(): Boolean;
          var
            ResultCode: Integer;
          begin
            Exec(ExpandConstant('{cmd}'),
              '/C taskkill /IM TinyFtpDrive.exe /F >NUL 2>&1 & taskkill /IM yongbongE.exe /F >NUL 2>&1 & exit /B 0',
              '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Result := True;
          end;
          '@
          Set-Content -Path "$env:GITHUB_WORKSPACE\yongbongE.iss" -Value $iss -Encoding UTF8
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "$env:GITHUB_WORKSPACE\yongbongE.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist"

      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-Setup-v0.2
          path: dist/yongbongE-Setup-v0.2.exe
          if-no-files-found: error
