name: Polaris 6.09 approved direct APK release
on:
  push:
    branches: [experiment/polaris-6-09-session-fix]
    paths: ['.github/workflows/polaris609-sessionfix-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait for tested 6.09 build and Android 13 smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 43996968790 --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: Polaris-6.09-100609-validated
          path: artifact
          run-id: 43996968790
          github-token: ${{ github.token }}
      - name: Validate actual signed APK and version
        run: |
          test -s artifact/Polaris_6.09_100609.apk
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          echo "$expected  artifact/Polaris_6.09_100609.apk" | sha256sum --check -
          grep "package: name='app.hush.music.polarisradio.debug' versionCode='100609' versionName='6.09'" artifact/apk-badging.txt
          grep '477721bae3a205d4e6369e76482868978b74931a0b2c4dfe85f3b07a7b40bea8' artifact/signature.txt
          unzip -t artifact/Polaris_6.09_100609.apk > /dev/null
      - name: Publish stable direct download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          if ! gh release view 'polaris-v6.09' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create 'polaris-v6.09' --repo "$GITHUB_REPOSITORY" --target '405f0028e1606592bf0f17ec4a6c9bcd5fa54a61' \
              --title 'Polaris Unbound 6.09 (100609)' \
              --notes "Fix AA Streaming InterTune-style 4 category icons + playable song list by routing cached playlist and streaming entry IDs to one home; real playlist remains separately accessible. Rebuild versioned radio station browse IDs and centered programme artwork with actual PNG provider runtime test. 6.08 playback, radio, database, signer maintained. SHA-256: $expected."
          fi
          gh release upload 'polaris-v6.09' 'artifact/Polaris_6.09_100609.apk' --repo "$GITHUB_REPOSITORY" --clobber
          gh release view 'polaris-v6.09' --repo "$GITHUB_REPOSITORY" --json url,assets
      - name: Write verified direct-link receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p polaris6/diagnostics
          link=$(gh release view 'polaris-v6.09' --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="Polaris_6.09_100609.apk") | .url')
          test -n "$link"
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          printf 'APK_URL=%s\nSHA256=%s\nBUILD_RUN=%s\nANDROID13_TEST=4/4 PASS\n' "$link" "$expected" '43996968790' > polaris6/diagnostics/609-direct-release.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add polaris6/diagnostics/609-direct-release.txt
          git commit -m 'Record verified 6.09 APK direct release URL' || exit 0
          git push origin HEAD:experiment/polaris-6-09-session-fix
