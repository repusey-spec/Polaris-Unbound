name: Build yongbongE v0.17 LIGHT

on:
  push:
    branches:
      - yongbonge-v17-light
    paths:
      - .github/workflows/build-yongbonge-v17-light.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.11 base
        shell: pwsh
        run: |
          ./yongbongE-build/build-v11.ps1

      - name: Apply v0.17 LIGHT sources
        shell: pwsh
        run: |
          Copy-Item "yongbongE-expanded-v17-light/FtpClient.cs" "src/TinyFtpDrive/FtpClient.cs" -Force
          Copy-Item "yongbongE-expanded-v17-light/FtpFileSystem.cs" "src/TinyFtpDrive/FtpFileSystem.cs" -Force
          Copy-Item "yongbongE-expanded-v17-light/Program.cs" "src/TinyFtpDrive/Program.cs" -Force
          [IO.File]::WriteAllText("src/TinyFtpDrive/VERSION.txt", "0.17.0-LIGHT" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))

      - name: Compile v0.17 LIGHT
        shell: pwsh
        run: |
          dotnet build "src/TinyFtpDrive/TinyFtpDrive.csproj" -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "LIGHT build failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iss = [IO.File]::ReadAllText("yongbongE.iss")
          $iss = $iss.Replace("AppVersion=0.11.0", "AppVersion=0.17.0")
          $iss = $iss.Replace("OutputBaseFilename=yongbongE-Setup-v0.11", "OutputBaseFilename=yongbongE-Setup-v0.17-LIGHT")
          [IO.File]::WriteAllText("yongbongE-v17-light.iss", $iss, (New-Object System.Text.UTF8Encoding($false)))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "yongbongE-v17-light.iss"
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Verify outputs
        shell: pwsh
        run: |
          $exe = "dist/yongbongE-Setup-v0.17-LIGHT.exe"
          if (!(Test-Path $exe)) { throw "installer missing" }
          Write-Host "Trace references:"
          Select-String -Path "src/TinyFtpDrive/FtpClient.cs","src/TinyFtpDrive/FtpFileSystem.cs" -Pattern "TraceLog" -SimpleMatch
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256
          Get-FileHash "src/TinyFtpDrive/FtpClient.cs" -Algorithm SHA256
          Get-FileHash "src/TinyFtpDrive/FtpFileSystem.cs" -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-v0.17-LIGHT
          path: dist/yongbongE-Setup-v0.17-LIGHT.exe
          if-no-files-found: error
          retention-days: 30
