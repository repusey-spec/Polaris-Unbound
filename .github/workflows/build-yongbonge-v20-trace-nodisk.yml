name: Build yongbongE v0.20 TRACE-NODISK

on:
  push:
    branches:
      - yongbonge-v20-trace-nodisk
    paths:
      - .github/workflows/build-yongbonge-v20-trace-nodisk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.11 base
        shell: pwsh
        run: |
          ./yongbongE-build/build-v11.ps1

      - name: Apply v0.16 sources plus no-disk trace
        shell: pwsh
        run: |
          Copy-Item "yongbongE-expanded-v15-trace/FtpClient.cs" "src/TinyFtpDrive/FtpClient.cs" -Force
          Copy-Item "yongbongE-expanded-v16-nettrace/FtpFileSystem.cs" "src/TinyFtpDrive/FtpFileSystem.cs" -Force
          Copy-Item "yongbongE-expanded-v15-trace/Program.cs" "src/TinyFtpDrive/Program.cs" -Force
          Copy-Item "yongbongE-expanded-v20-trace-nodisk/TraceLog.cs" "src/TinyFtpDrive/TraceLog.cs" -Force
          [IO.File]::WriteAllText("src/TinyFtpDrive/VERSION.txt", "0.20.0-TRACE-NODISK" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))

      - name: Verify only trace implementation changed
        shell: pwsh
        run: |
          foreach ($p in @(
            "yongbongE-expanded-v15-trace/FtpClient.cs",
            "yongbongE-expanded-v16-nettrace/FtpFileSystem.cs",
            "yongbongE-expanded-v15-trace/Program.cs"
          )) {
            if (!(Test-Path $p)) { throw "Missing v0.16 source: $p" }
          }
          $trace = Get-Content "src/TinyFtpDrive/TraceLog.cs" -Raw
          foreach ($bad in @("File.AppendAllText","File.WriteAllText","File.Exists","new FileInfo","Directory.CreateDirectory")) {
            if ($trace.Contains($bad)) { throw "Trace filesystem I/O remains: $bad" }
          }
          if (!$trace.Contains("lock (Sync)")) { throw "Trace serialization lock missing" }

      - name: Compile v0.20 TRACE-NODISK
        shell: pwsh
        run: |
          dotnet build "src/TinyFtpDrive/TinyFtpDrive.csproj" -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "TRACE-NODISK build failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iss = [IO.File]::ReadAllText("yongbongE.iss")
          $iss = $iss.Replace("AppVersion=0.11.0", "AppVersion=0.20.0")
          $iss = $iss.Replace("OutputBaseFilename=yongbongE-Setup-v0.11", "OutputBaseFilename=yongbongE-Setup-v0.20-TRACE-NODISK")
          [IO.File]::WriteAllText("yongbongE-v20-trace-nodisk.iss", $iss, (New-Object System.Text.UTF8Encoding($false)))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "yongbongE-v20-trace-nodisk.iss"
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Verify outputs
        shell: pwsh
        run: |
          $exe = "dist/yongbongE-Setup-v0.20-TRACE-NODISK.exe"
          if (!(Test-Path $exe)) { throw "installer missing" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-v0.20-TRACE-NODISK
          path: dist/yongbongE-Setup-v0.20-TRACE-NODISK.exe
          if-no-files-found: error
          retention-days: 30
