name: Polaris 6.10 Android 13 smoke test on signed APK
on:
  push:
    branches: [experiment/polaris-6-10-compact-stream-radio]
    paths:
      - '.github/workflows/polaris610-smoke-only.yml'
      - 'polaris610-ci/fix_test_desugar610.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Polaris-6.10-100610-validated
          path: delivery
          run-id: 44053181689
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Reconstruct test-only desugared runtime without changing signed APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
          mkdir -p "$RUNNER_TEMP/polaris610-test-runtime"
          base64 -d .github/polaris-debug.keystore.b64 > "$RUNNER_TEMP/polaris610-test-runtime/polaris.jks"
          python3 polaris610-ci/fix_test_desugar610.py
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python3 polaris6/smoke610.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Polaris-6.10-validated-smoke-retest
          path: smoke/
          retention-days: 14
      - name: Record retest result
        if: always()
        run: |
          git fetch origin experiment/polaris-6-10-compact-stream-radio
          git reset --hard origin/experiment/polaris-6-10-compact-stream-radio
          mkdir -p polaris6/diagnostics
          if grep -q 'OK (5 tests)' smoke/session-test.txt 2>/dev/null; then
            VERDICT='PASS 5/5 Android 13 instrumentation tests'
          else
            VERDICT='FAIL or incomplete Android 13 instrumentation tests'
          fi
          printf 'RUN_ID=%s\nRESULT=%s\nAPK_RUN_ID=44053181689\n' "$GITHUB_RUN_ID" "$VERDICT" > polaris6/diagnostics/610-smoke-retest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add polaris6/diagnostics/610-smoke-retest.txt
          git commit -m 'Record 6.10 Android 13 retest result' || true
          git push origin HEAD:experiment/polaris-6-10-compact-stream-radio
