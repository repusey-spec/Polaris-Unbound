name: Polaris 6.07 stable APK download
on:
  push:
    branches: [experiment/polaris-6-07-mini-controls]
    paths: ['.github/workflows/polaris607-release-download.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require 6.07 build and Android 13 smoke to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 43960311493 --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: Polaris-6.07-100607
          path: artifact
          run-id: 43960311493
          github-token: ${{ github.token }}
      - name: Verify production APK, version, signing and SHA-256
        run: |
          test -s artifact/Polaris_6.07_100607.apk
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          echo "$expected  artifact/Polaris_6.07_100607.apk" | sha256sum --check -
          grep "package: name='app.hush.music.polarisradio.debug' versionCode='100607' versionName='6.07'" artifact/apk-badging.txt
          grep '477721bae3a205d4e6369e76482868978b74931a0b2c4dfe85f3b07a7b40bea8' artifact/signature.txt
          unzip -t artifact/Polaris_6.07_100607.apk > /dev/null
      - name: Publish permanent GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(awk '{print $1}' artifact/SHA256.txt)
          if ! gh release view 'polaris-v6.07' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create 'polaris-v6.07' --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Polaris Unbound 6.07 (100607)' \
              --notes "Radio phone mini-player uses matching previous/next vector icons and actual play/pause icons, not text glyphs. Original 6.06 engine, playlists, last-source resume and programme schedules preserved. Build and Android 13 tests passed. SHA-256: $expected."
          fi
          gh release upload 'polaris-v6.07' 'artifact/Polaris_6.07_100607.apk' --repo "$GITHUB_REPOSITORY" --clobber
          gh release view 'polaris-v6.07' --repo "$GITHUB_REPOSITORY" --json url,assets
