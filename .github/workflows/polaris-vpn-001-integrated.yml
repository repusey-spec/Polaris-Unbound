name: Polaris 6.17 - ARM64 vehicle VPN release candidate
on:
  push:
    branches: [release/polaris-6.17-vpn]
    paths: [".github/workflows/polaris-vpn-001-integrated.yml", "polarisvpn/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polaris-617-integrated
  cancel-in-progress: true
jobs:
  integrated-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install native build toolchains
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Build Windscribe core with app-scoped radio bypass
        run: |
          git clone --recurse-submodules https://github.com/Windscribe/Android-App.git "$RUNNER_TEMP/windscribe"
          cd "$RUNNER_TEMP/windscribe"
          git checkout 5a37e6afafded0279d67714eec878f9524ae90dc
          git submodule update --init --recursive
          python3 - <<'PY'
          from pathlib import Path
          p=Path('windscribe-core/build.gradle.kts')
          s=p.read_text()
          old='objects.named(ProductFlavorAttr::class.java, "whitelabel")'
          assert s.count(old)==1
          p.write_text(s.replace(old, 'objects.named(ProductFlavorAttr::class.java, "fdroid")'))
          p=Path('base/src/main/java/com/windscribe/vpn/Windscribe.kt')
          s=p.read_text()
          assert s.count('lateinit var dataStore: DataStore<Preferences>')==1
          p.write_text(s.replace('lateinit var dataStore: DataStore<Preferences>','lateinit var windscribePrefsStore: DataStore<Preferences>'))
          p=Path('base/src/main/java/com/windscribe/vpn/backend/tunnel/WindscribeVpnService.kt')
          s=p.read_text()
          a='            config.disallowedApps.forEach { runCatching { builder.addDisallowedApplication(it) } }'
          b='            config.allowedApps.forEach { runCatching { builder.addAllowedApplication(it) } }'
          assert s.count(a)==1 and s.count(b)==1
          s=s.replace(a,'            builder.addAllowedApplication(packageName)').replace(b,'            builder.allowBypass()')
          p.write_text(s)
          PY
          python3 "$GITHUB_WORKSPACE/polarisvpn/limit_wireguard.py" "$RUNNER_TEMP/windscribe"
          python3 "$GITHUB_WORKSPACE/polarisvpn/release617.py" core "$RUNNER_TEMP/windscribe"
          chmod +x gradlew
          ./gradlew :windscribe-core:bundle --stacktrace --max-workers=2
          test -s windscribe-core/build/outputs/aar/windscribe-core.aar
          test -s windscribe-core/build/outputs/aar/windscribe-core-dependencies.gradle
          python3 "$GITHUB_WORKSPACE/polarisvpn/release617.py" prune "$RUNNER_TEMP/windscribe"
      - name: Pin InterTune engine
        run: |
          git clone --depth 1 --branch v0.12.10 --recurse-submodules https://github.com/ItzSkyeYT/InterTune.git "$RUNNER_TEMP/intertune"
          test "$(git -C "$RUNNER_TEMP/intertune" rev-parse HEAD)" = 4ff39e9e12a20f93d5dfd24c52fe925cbbb50020
      - name: Apply Polaris integration and original signer
        run: |
          base64 -d polaris6/intertune.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply --check "$RUNNER_TEMP/polaris.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$RUNNER_TEMP/polaris.patch"
          python3 polaris6/native_603.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify.py "$RUNNER_TEMP/intertune"
          git -C "$RUNNER_TEMP/intertune" apply --check "$GITHUB_WORKSPACE/polaris6/radio604.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$GITHUB_WORKSPACE/polaris6/radio604.patch"
          git -C "$RUNNER_TEMP/intertune" apply --check "$GITHUB_WORKSPACE/polaris6/stream604.patch"
          git -C "$RUNNER_TEMP/intertune" apply "$GITHUB_WORKSPACE/polaris6/stream604.patch"
          python3 polaris6/verify604.py "$RUNNER_TEMP/intertune"
          python3 polaris6/playlist605.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify605.py "$RUNNER_TEMP/intertune"
          python3 polaris6/fixes606.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify606.py "$RUNNER_TEMP/intertune"
          python3 polaris6/mini607.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify607.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa608.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify608.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa609.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify609.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa610.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify610.py "$RUNNER_TEMP/intertune"
          python3 polaris6/cal611.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify611.py "$RUNNER_TEMP/intertune"
          python3 polaris6/version611.py "$RUNNER_TEMP/intertune"
          python3 polaris6/fix612_release_cal.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa613.py "$RUNNER_TEMP/intertune"
          cp polaris6/PolarisAA613BrowserTest.kt "$RUNNER_TEMP/intertune/app/src/androidTest/java/com/dd3boh/outertune/polaris/PolarisAA613BrowserTest.kt"
          python3 polaris6/verify613.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa614.py "$RUNNER_TEMP/intertune"
          python3 polaris6/version614.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify614.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa615.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa615bundle.py "$RUNNER_TEMP/intertune"
          python3 polaris6/version615.py "$RUNNER_TEMP/intertune"
          cp polaris6/PolarisAA615BrowserTest.kt "$RUNNER_TEMP/intertune/app/src/androidTest/java/com/dd3boh/outertune/polaris/PolarisAA615BrowserTest.kt"
          python3 polaris6/verify615.py "$RUNNER_TEMP/intertune"
          python3 polaris6/verify615bundle.py "$RUNNER_TEMP/intertune"
          python3 polaris6/aa616.py "$RUNNER_TEMP/intertune"
          python3 polaris6/version616.py "$RUNNER_TEMP/intertune"
          cp polaris6/PolarisAA616BrowserTest.kt "$RUNNER_TEMP/intertune/app/src/androidTest/java/com/dd3boh/outertune/polaris/PolarisAA616BrowserTest.kt"
          python3 polaris6/verify616.py "$RUNNER_TEMP/intertune"
          base64 -d .github/polaris-debug.keystore.b64 > "$RUNNER_TEMP/intertune/polaris.jks"
          cat > "$RUNNER_TEMP/intertune/keystore.properties" <<'EOF'
          storeFile=../polaris.jks
          storePassword=android
          keyAlias=polarisdebug
          keyPassword=android
          EOF
      - name: Integrate Windscribe into reconstructed Polaris 6.16 player
        run: |
          python3 polarisvpn/apply_radio_transport.py "$RUNNER_TEMP/intertune"
          python3 polarisvpn/apply_core_host.py "$RUNNER_TEMP/intertune" "$RUNNER_TEMP/windscribe"
          cp polarisvpn/PolarisVpnActivity.kt "$RUNNER_TEMP/intertune/app/src/main/java/com/dd3boh/outertune/polaris/"
          python3 polarisvpn/apply_route_ip.py "$RUNNER_TEMP/intertune"
          python3 polarisvpn/release617.py host "$RUNNER_TEMP/intertune"
      - name: Compile and sign integrated player APK
        working-directory: ${{ runner.temp }}/intertune
        run: ./gradlew --build-cache :app:assembleCoreRelease --stacktrace --max-workers=2
      - name: Verify final package includes player, car service and real Windscribe service
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp "$RUNNER_TEMP/intertune/app/build/outputs/apk/core/release/"*.apk delivery/Polaris_6.17.apk
          APK=delivery/Polaris_6.17.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee delivery/badging.txt
          grep -F "package: name='com.polaris.vpn' versionCode='100617' versionName='6.17'" delivery/badging.txt
          grep -Fx "application-label:'Polaris 6.17'" delivery/badging.txt
          grep -Fx "native-code: 'arm64-v8a'" delivery/badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > delivery/manifest.txt
          grep -F 'com.dd3boh.outertune.playback.MusicService' delivery/manifest.txt
          grep -F 'com.dd3boh.outertune.playback.AutoCarService' delivery/manifest.txt
          grep -F 'com.windscribe.vpn.backend.tunnel.WindscribeVpnService' delivery/manifest.txt
          grep -F 'com.dd3boh.outertune.polaris.PolarisVpnActivity' delivery/manifest.txt
          grep -F 'com.windscribe.vpn.bootreceiver.WindscribeBootReceiver' delivery/manifest.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('delivery/Polaris_6.17.apk') as z:
              libs=[n for n in z.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')]
              assert all(n.split('/')[1]=='arm64-v8a' for n in z.namelist() if n.startswith('lib/') and n.endswith('.so'))
              from collections import defaultdict
              groups=defaultdict(int)
              for entry in z.infolist():
                  key=entry.filename if entry.filename.endswith('.so') else entry.filename.split('/')[0]
                  groups[key]+=entry.compress_size
              with open('delivery/size-breakdown.txt','w') as f:
                  for key,value in sorted(groups.items(),key=lambda x:-x[1]):
                      f.write(f'{value/1000000:.3f} MB {key}\n')
              print(Path('delivery/size-breakdown.txt').read_text())
              print(libs)
              print("APK size MB:", Path('delivery/Polaris_6.17.apk').stat().st_size / 1000000)
              for entry in z.infolist():
                  if entry.filename.startswith('lib/') and entry.filename.endswith('.so'):
                      assert entry.compress_type != zipfile.ZIP_STORED, 'Uncompressed native library: '+entry.filename
              assert any('wg-go' in n or 'wireguard' in n.lower() for n in libs), 'Missing ARM64 WireGuard binary'
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > delivery/signature.txt
          sha256sum "$APK" > delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris-6.17-ARM64-APK
          path: delivery/
          if-no-files-found: error
          retention-days: 14
