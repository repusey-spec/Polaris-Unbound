name: Build yongbongE v0.24 DIRECT-UPLOAD-HIDE-SYSTEM

on:
  push:
    branches:
      - yongbonge-v24-direct-upload-hide-system
    paths:
      - .github/workflows/build-yongbonge-v24-direct-upload-hide-system.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.11 base
        shell: pwsh
        run: |
          ./yongbongE-build/build-v11.ps1

      - name: Apply v0.24 sources
        shell: pwsh
        run: |
          Copy-Item "yongbongE-expanded-v24-direct-upload-hide-system/FtpClient.cs" "src/TinyFtpDrive/FtpClient.cs" -Force
          Copy-Item "yongbongE-expanded-v24-direct-upload-hide-system/FtpFileSystem.cs" "src/TinyFtpDrive/FtpFileSystem.cs" -Force
          Copy-Item "yongbongE-expanded-v15-trace/Program.cs" "src/TinyFtpDrive/Program.cs" -Force
          Copy-Item "yongbongE-expanded-v20-trace-nodisk/TraceLog.cs" "src/TinyFtpDrive/TraceLog.cs" -Force
          [IO.File]::WriteAllText("src/TinyFtpDrive/VERSION.txt", "0.24.0-DIRECT-UPLOAD-HIDE-SYSTEM" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))

      - name: Verify v0.24 fixes
        shell: pwsh
        run: |
          $ftp = Get-Content "src/TinyFtpDrive/FtpClient.cs" -Raw
          $fs = Get-Content "src/TinyFtpDrive/FtpFileSystem.cs" -Raw
          foreach ($required in @(
            "STOR "" + _uploadPath",
            "TryDeleteFileNoThrow",
            "directFinalPath: h.Created && !h.Uploaded",
            "entries.RemoveAll(e => IsHiddenSystemName(e.Name))",
            """#recycle""",
            """_DAV""",
            "VideoSeekReadAheadSize = 4 * 1024 * 1024",
            "Dictionary<string, FtpHandle> _pendingWrites",
            "host.NamedStreams = false;"
          )) {
            if (!$ftp.Contains($required) -and !$fs.Contains($required)) { throw "Missing requirement: $required" }
          }

      - name: Compile v0.24
        shell: pwsh
        run: |
          dotnet build "src/TinyFtpDrive/TinyFtpDrive.csproj" -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "v0.24 build failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iss = [IO.File]::ReadAllText("yongbongE.iss")
          $iss = $iss.Replace("AppVersion=0.11.0", "AppVersion=0.24.0")
          $iss = $iss.Replace("OutputBaseFilename=yongbongE-Setup-v0.11", "OutputBaseFilename=yongbongE-Setup-v0.24-DIRECT-UPLOAD")
          [IO.File]::WriteAllText("yongbongE-v24.iss", $iss, (New-Object System.Text.UTF8Encoding($false)))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "yongbongE-v24.iss"
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Verify outputs
        shell: pwsh
        run: |
          $exe = "dist/yongbongE-Setup-v0.24-DIRECT-UPLOAD.exe"
          if (!(Test-Path $exe)) { throw "installer missing" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-v0.24-DIRECT-UPLOAD
          path: dist/yongbongE-Setup-v0.24-DIRECT-UPLOAD.exe
          if-no-files-found: error
          retention-days: 30
