name: Polaris 0.61 Native Radio Info APK
on:
  push:
    branches: [legacy-0.61-native-radio-info]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable 0.x signing key
        run: |
          base64 -d .github/polaris-debug.keystore.b64 > .github/polaris-debug.keystore
          keytool -list -keystore .github/polaris-debug.keystore -storepass android -alias polarisdebug >/dev/null
      - name: Compile 0.61 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" dist/Polaris_0.61_61.apk
          sha256sum dist/Polaris_0.61_61.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris_0.61_61
          path: dist/Polaris_0.61_61.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view polaris-v0.61 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload polaris-v0.61 dist/Polaris_0.61_61.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create polaris-v0.61 dist/Polaris_0.61_61.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Polaris 0.61 - Native MBC track and KBS program text' \
              --notes '0.60 web-page approach removed. Radio detail is a native text UI. MBC live track and current program use broadcaster JSONP endpoints; KBS CoolFM program uses KBS 2FM channel 25 schedule API. Read-only live listener messages, full historical playlist and KBS individual track API remain unverified/unimplemented and are clearly labeled, not substituted with website. All 0.59/0.60 radio & Bluetooth behavior otherwise retained. Device testing required.'
          fi
