name: Build yongbongE v0.22 PENDING-FILES

on:
  push:
    branches:
      - yongbonge-v22-pending-files
    paths:
      - .github/workflows/build-yongbonge-v22-pending-files.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.11 base
        shell: pwsh
        run: |
          ./yongbongE-build/build-v11.ps1

      - name: Apply v0.22 pending-file sources
        shell: pwsh
        run: |
          Copy-Item "yongbongE-expanded-v15-trace/FtpClient.cs" "src/TinyFtpDrive/FtpClient.cs" -Force
          Copy-Item "yongbongE-expanded-v22-pending-files/FtpFileSystem.cs" "src/TinyFtpDrive/FtpFileSystem.cs" -Force
          Copy-Item "yongbongE-expanded-v15-trace/Program.cs" "src/TinyFtpDrive/Program.cs" -Force
          Copy-Item "yongbongE-expanded-v20-trace-nodisk/TraceLog.cs" "src/TinyFtpDrive/TraceLog.cs" -Force
          [IO.File]::WriteAllText("src/TinyFtpDrive/VERSION.txt", "0.22.0-PENDING-FILES" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))

      - name: Verify pending-file patch only
        shell: pwsh
        run: |
          $fs = Get-Content "src/TinyFtpDrive/FtpFileSystem.cs" -Raw
          foreach ($required in @(
            "Dictionary<string, FtpHandle> _pendingWrites",
            "RegisterPendingWrite(h);",
            "OpenPendingShadow(pending)",
            "IsPendingShadow",
            "UnregisterPendingWrite(h);",
            "MovePendingWrite(h, oldPath, newPath)",
            "host.NamedStreams = false;"
          )) {
            if (!$fs.Contains($required)) { throw "Missing pending-file requirement: $required" }
          }

      - name: Compile v0.22 PENDING-FILES
        shell: pwsh
        run: |
          dotnet build "src/TinyFtpDrive/TinyFtpDrive.csproj" -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "PENDING-FILES build failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iss = [IO.File]::ReadAllText("yongbongE.iss")
          $iss = $iss.Replace("AppVersion=0.11.0", "AppVersion=0.22.0")
          $iss = $iss.Replace("OutputBaseFilename=yongbongE-Setup-v0.11", "OutputBaseFilename=yongbongE-Setup-v0.22-PENDING-FILES")
          [IO.File]::WriteAllText("yongbongE-v22-pending-files.iss", $iss, (New-Object System.Text.UTF8Encoding($false)))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "yongbongE-v22-pending-files.iss"
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Verify outputs
        shell: pwsh
        run: |
          $exe = "dist/yongbongE-Setup-v0.22-PENDING-FILES.exe"
          if (!(Test-Path $exe)) { throw "installer missing" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: yongbongE-v0.22-PENDING-FILES
          path: dist/yongbongE-Setup-v0.22-PENDING-FILES.exe
          if-no-files-found: error
          retention-days: 30
