name: Polaris 6.06 permanent APK download

on:
  push:
    branches: [experiment/polaris-6-06-aa-entry-resume]
    paths: ['.github/workflows/polaris606-release-download.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Polaris-6.06-100606
          path: artifact
          run-id: 43876528994
          github-token: ${{ github.token }}
      - name: Verify exact previously signed APK
        run: |
          test -s artifact/Polaris_6.06_100606.apk
          echo 'a2be3b482e1606ef42e9a1d9a273d03c473a0cb02ce204171f5b6461e18151ee  artifact/Polaris_6.06_100606.apk' | sha256sum -c -
          unzip -t artifact/Polaris_6.06_100606.apk > /dev/null
      - name: Publish stable direct-download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view 'polaris-v6.06' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create 'polaris-v6.06' --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Polaris Unbound 6.06 (100606)' --notes 'Previously tested, signed Polaris 6.06 APK. SHA-256: a2be3b482e1606ef42e9a1d9a273d03c473a0cb02ce204171f5b6461e18151ee. This is the same build as GitHub Actions run 43876528994. No rebuild.'
          fi
          gh release upload 'polaris-v6.06' 'artifact/Polaris_6.06_100606.apk' --repo "$GITHUB_REPOSITORY" --clobber
          gh release view 'polaris-v6.06' --repo "$GITHUB_REPOSITORY" --json url,assets
